<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mitarbeiter-Dashboard – Stadt Kebap & Pizzeria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <form class="login-card" id="loginForm">
    <h1>🥙 Mitarbeiter-Login</h1>
    <label>
      Passwort
      <input type="password" id="loginPassword" required />
    </label>
    <p class="login-error" id="loginError"></p>
    <button type="submit" class="login-btn">Anmelden</button>
  </form>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="emoji">🥙</span>
      <div>
        <strong>Stadt Kebap</strong>
        <small>&amp; Pizzeria</small>
      </div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item active" data-view="neu">
        <span>📋 Bestellungen</span>
        <span class="badge" id="badgeNeu">0</span>
      </button>
      <button class="nav-item" data-view="in_zubereitung">
        <span>👨‍🍳 In Zubereitung</span>
        <span class="badge muted" id="badgeZubereitung">0</span>
      </button>
      <button class="nav-item" data-view="fertig">
        <span>✅ Fertig</span>
        <span class="badge muted" id="badgeFertig">0</span>
      </button>
      <button class="nav-item" data-view="alle">
        <span>🧾 Alle Bestellungen</span>
      </button>
      <button class="nav-item" data-view="produkte">
        <span>🛒 Produkte</span>
      </button>
      <button class="nav-item" data-view="statistik">
        <span>📊 Statistik</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <button id="testSoundBtn" style="margin-top:8px;">🔊 Sound testen</button>
      <label class="autoprint-toggle">
        <span>Automatisch drucken</span>
        <input type="checkbox" id="autoPrintToggle" />
      </label>
      <div class="connection-status" id="connectionStatus">● verbinde …</div>
      <button id="logoutBtn" class="logout-btn">Abmelden</button>
      <button id="changePasswordBtn" class="logout-btn" style="margin-top:6px;">Password ändern</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <header class="main-header">
      <div class="header-title-row">
        <button class="icon-btn hidden" id="addProductIconBtn" title="Neues Produkt">+</button>
        <h1 id="viewTitle">Neue Bestellungen</h1>
      </div>
      <span class="today" id="todayLabel"></span>
    </header>

    <div class="orders-grid" id="ordersGrid">
      <p class="empty">Bestellungen werden geladen …</p>
    </div>

    <div class="products-view hidden" id="productsView">
      <div class="products-list" id="productsList"></div>
    </div>

    <div class="stats-view hidden" id="statsView">
      <div class="stats-range">
        <button class="range-btn active" data-range="heute">Heute</button>
        <button class="range-btn" data-range="woche">Woche</button>
        <button class="range-btn" data-range="monat">Monat</button>
      </div>

      <div class="stats-cards">
        <div class="stat-card">
          <div class="stat-label">Umsatz</div>
          <div class="stat-value" id="statRevenue">-</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Bestellungen</div>
          <div class="stat-value" id="statOrders">-</div>
        </div>
      </div>

      <div class="stats-chart-box">
        <h3>Umsatz pro Tag</h3>
        <canvas id="revenueChart"></canvas>
      </div>

      <div class="stats-top-box">
        <h3>Meistverkaufte Produkte</h3>
        <div id="topProductsList"
      </div>
    </div>

    </main>
</div>
<!-- Druckvorlage (nur beim Drucken sichtbar) -->
<div id="printArea" class="print-area"></div>

<!-- Produkt anlegen oder bearbeiten (Modal) -->
<div class="modal-overlay hidden" id="productFormOverlay">
  <section class="modal">
    <button class="modal-close" id="productFormClose">x</button>
    <h2 id="productFormTitle">Neues Produkt</h2>

    <form id="productForm">
      <label>
        Name
        <input type="text" id="pfName" required />
      </label>

      <label>
        Kategorie
        <input type="text" id="pfCategory" list="categoryOptions" required placeholder="z.B. Kebap & Dürüm"/>
        <datalist id="categoryOptions"></datalist>
      </label>

      <label>
        Beschreibung
        <textarea id="pfDescription" rows="2"></textarea>
      </label>

      <div class="form-row">
        <label>
          Basispreis (€)
          <input type="number" id="pfBasePrice" step="0.01" min="0" required />
        </label>

        <label>
          Emoji
          <input type="text" id="pfEmoji" maxlength="4" placeholder="🍽️" />
        </label>

      </div>

      <!--Produkt Foto einfügen -->
      <label class="file-upload-label">
        Produktbild (optional)
        <input type="file" id="pfImageFile" accept="image/*" class="file-input-hidden" />
        <span class="file-upload-btn" id="fileUploadBtn">📷 Bild auswählen</span>
      </label>
      <div class="image-preview" id="imagePreview"></div>

      <label class="checkbox-label">
        <input type="checkbox" id="pfPopular" />
        Als "Beliebt" markieren
      </label>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="productFormCancel">Abbrechen</button>
        <button type="submit" class="btn-save">Speichern</button>
      </div>

      <!-- Options-Gruppen-Editor ins Formular einfügen -->
      <div class="option-groups-editor">
        <div class="option-groups-header">
          <h3>Options-Gruppen</h3>
          <button type="button" class="btn-add-group" id="addGroupBtn">+ Gruppe</button>
        </div>
        <div id="optionGroupsList"></div>
      </div>

    </form>
  </section>
</div>
  <!-- Passwort ändern (Modal) -->
  <div class="modal-overlay hidden" id="passwordFormOverlay">
    <section class="modal">
      <button class="modal-close" id="passwordFormClose">✕</button>
      <h2>Passwort ändern</h2>

      <form id="passwordForm">
        <label>
          Aktuelles Passwort
          <input type="password" id="currentPasswordInput" required />
        </label>
        <label>
          Neues Passwort
          <input type="password" id="newPasswordInput" required minlength="4" />
        </label>

        <label>
          Neues Passwort bestätigen
          <input type="password" id="confirmPasswordInput" required minlength="4" />
        </label>

        <p class="login-error" id="passwordFormError"></p>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="passwordFormCancel">Abbrechen</button>
          <button type="submit" class="btn-save">Speichern</button>
        </div>
      </form>
    </section>
  </div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
